# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-noble
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
    steps:
      - uses: actions/checkout@v5

      - name: Check toolchain
        run: swift --version | grep -F "Swift version ${{ matrix.swift }}"

      - name: Build
        run: swift build

  macos:
    name: Swift ${{ matrix.swift }} on macOS
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Each Xcode path exists only on the runner image listed with it.
        include:
          - swift: "6.2"
            runner: macos-26
            xcode: "26.3"
          - swift: "6.3"
            runner: macos-26
            xcode: "26.4"
          - swift: "6.4"
            runner: xcode-27
            xcode: "27.2"
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app
    steps:
      - uses: actions/checkout@v5

      - name: Check toolchain
        run: swift --version | grep -F "Swift version ${{ matrix.swift }}"

      - name: Build
        run: swift build
