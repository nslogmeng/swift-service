# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Swift 6.2 on Linux
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: |
          swift --version
          swift test

  macos:
    name: Swift 6.2 on macOS
    # Pinned because the Xcode path below exists only on this image.
    runs-on: macos-26
    env:
      # Xcode 26.3 ships Swift 6.2.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: |
          swift --version
          swift test
